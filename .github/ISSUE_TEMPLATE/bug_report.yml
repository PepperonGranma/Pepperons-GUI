name: Bug report
description: Something in Pepperon GUI does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems should go through private reporting instead — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the phone by USB
        2. Open Video and set …
        3. Press Start Mirroring
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Pepperon GUI version
      placeholder: 1.5.0 (installer) or a commit hash
    validations:
      required: true
  - type: input
    id: scrcpy-version
    attributes:
      label: scrcpy version and source
      description: Shown under the Command preview on the Studio page. Say whether it was installed by the app or chosen manually.
      placeholder: 4.1, installed by the app
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: device
    attributes:
      label: Android device and version
      placeholder: Pixel 7, Android 15, USB
  - type: textarea
    id: command
    attributes:
      label: Command preview
      description: Copy it from the Command preview card. Remove the serial if you prefer.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Activity log
      description: On the Studio page, use "Copy log" in the Activity card and paste it here.
      render: text
